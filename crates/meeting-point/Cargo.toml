[package]
name = "meeting-point"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Prepared shortest-path trees for the meeting-point WASM prototype"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# Match the energy-ring build: do not run wasm-pack's bundled Binaryen.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
